<nav class="bg-slate-50 dark:bg-[#232323] duration-300 transition-all dark:border-[#232323] fixed w-full z-20 top-0 left-0 border-b border-gray-100">
  <!-- الحاوية الرئيسية -->
  <div class="max-w-screen-xl mx-auto flex items-center justify-between p-2">
    <!-- القسم الأيسر: الشعار وروابط القائمة (تظهر على الشاشات الكبيرة) -->
    <div class="flex items-center">
      <!-- الشعار -->
      <a routerLink="" class="flex items-center space-x-2">
        <img src="/prime care.png" class="h-12 md:h-16" alt="PrimeCare" />
      </a>
      <!-- روابط القائمة (تُعرض ابتداءً من الشاشات المتوسطة) -->
      <ul class="hidden md:flex space-x-5 md:space-x-2 md:ml-6 xl:ml-56">
        <li>
          <a routerLink="/home" routerLinkActive="active" class="py-2 px-3 hover:text-blue-700 dark:text-white duration-300 transition-colors">
            Home
          </a>
        </li>
        <li>
          <a routerLink="/All-prodect" routerLinkActive="active" class="py-2 px-3 hover:text-blue-700 dark:text-white duration-300 transition-colors">
            All product
          </a>
        </li>
        <li>
          <a routerLink="/categories" routerLinkActive="active" class="py-2 px-3 hover:text-blue-700 dark:text-white duration-300 transition-colors">
            Categories
          </a>
        </li>
        <li>
          <a routerLink="/about" routerLinkActive="active" class="py-2 px-3 hover:text-blue-700 dark:text-white duration-300 transition-colors">
            About
          </a>
        </li>
      </ul>
    </div>

    <!-- القسم الأيمن: أيقونات الإجراء وزر الدخول والقائمة المتجاوبة -->
    <div class="flex items-center max-sm:space-x-1 space-x-4">
      <button *ngIf="isLoggedIn" class="text-black   hover:text-red-500">
        <i class="fa-regular fa-heart text-2xl dark:text-white duration-300 dark:hover:text-red-500 transition-colors hover:text-red-500 "></i>
      </button>

      <!-- زر البحث -->
      <button class="text-black dark:text-white duration-300 transition-colors dark:hover:text-blue-500 hover:text-blue-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21 21l-4.35-4.35m2.3-5.65a7 7 0 1 1-14 0 
               7 7 0 0 1 14 0z"
          ></path>
        </svg>
      </button>

      <!-- أيقونة عربة التسوق -->
      <a *ngIf="isLoggedIn" href="/cart" class="relative text-black dark:text-white duration-300 transition-all dark:hover:text-blue-500 hover:text-blue-500 ">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
             viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 3h2l3.6 7.59M7 16h10l3-9H6.8m-1.6 0L5 6 
                   m5 14a1 1 0 102 0 1 1 0 00-2 0 
                   m6 0a1 1 0 102 0 1 1 0 00-2 0"/>
        </svg>
        <span id="cart-count" class="absolute -top-4 -right-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full hidden">
          {{ cartCount }}
        </span>
      </a>

      <!-- زر الدخول للمستخدم غير المسجل -->
      <button *ngIf="!isLoggedIn" type="button" routerLink="login"
              class="text-white bg-[#8ACCFF] hover:bg-blue-500 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-full text-sm px-4 py-2">
        LOGIN
      </button>

      <!-- زر القائمة (الهامبرغر) يظهر فقط في الشاشات الصغيرة -->
      <button (click)="toggleMenu()" type="button"
      class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2"
      aria-controls="navbar-menu" [attr.aria-expanded]="isMenuOpen">
<span class="sr-only">Open main menu</span>
<i class="fa-solid fa-bars mr-2 text-2xl"></i>
</button>


      <!-- أيقونة الملف الشخصي للمستخدم -->
      <div class="relative inline-block text-left" *ngIf="isLoggedIn">
        <button (click)="toggleDropdown()" class="text-black dark:text-white duration-300 transition-all dark:hover:text-blue-500 hover:text-blue-500 ">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
               viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M5.121 17.804A4 4 0 018 15h8a4 4 0 012.879 1.121
                     M12 11a4 4 0 100-8 4 4 0 000 8z"/>
          </svg>
        </button>

        <div *ngIf="isDropdownOpen" class="absolute right-0 mt-2 w-48 bg-white dark:bg-[#303030] border rounded-lg shadow-lg z-50 duration-300 transition-colors">
          <!-- Edit Profile Link -->
          <a routerLink=""
             class="block px-4 py-2 text-gray-700 dark:text-white hover:bg-gray-100 dark:hover:bg-[#383838] cursor-pointer duration-300 transition-colors">
            Edit Profile
          </a>
          
          <!-- Change Mood / Dark Mode Toggle -->
          <div class="px-4 py-2 hover:bg-gray-100 dark:hover:bg-[#383838] cursor-pointer duration-300 transition-colors flex items-center justify-between">
            <span class="text-gray-700 dark:text-white duration-300 transition-colors">Change Mood</span>
            <label for="themeToggle" class="themeToggle st-sunMoonThemeToggleBtn">
              <input type="checkbox" id="themeToggle" class="themeToggleInput  " (click)="toggleTheme()" />
              <span class="customCheckbox">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  stroke="none"
                >
                 
                  <g>
                    <circle class="sunRay sunRay1" cx="18" cy="10" r="1.5" />
                    <circle class="sunRay sunRay2" cx="14" cy="16.928" r="1.5" />
                    <circle class="sunRay sunRay3" cx="6" cy="16.928" r="1.5" />
                    <circle class="sunRay sunRay4" cx="2" cy="10" r="1.5" />
                    <circle class="sunRay sunRay5" cx="6" cy="3.1718" r="1.5" />
                    <circle class="sunRay sunRay6" cx="14" cy="3.1718" r="1.5" />
                  </g>
                  <mask id="moon-mask">
                    <rect x="0" y="0" width="20" height="20" fill="white" />
                    <circle cx="11" cy="3" r="8" fill="black" />
                  </mask>
                  <circle
                 
                    class="sunMoon"
                    cx="10"
                    cy="10"
                    r="8"
                    mask="url(#moon-mask)"
                  />
                </svg>
              </span>
            </label>
            
          </div>
        
          <!-- Logout Link -->
          <a (click)="logout()"
          class="flex items-center px-4 py-2 text-red-600 dark:text-red-500 hover:bg-gray-100 dark:hover:bg-[#383838] cursor-pointer duration-300 transition-colors">
          Log out
          <i class="fa-solid fa-right-from-bracket ml-2 text-current"></i>
       </a>
       
        </div>
        
      </div>
    </div>
  </div>

  <!-- قائمة الموبايل -->
  <div *ngIf="isMenuOpen" class="md:hidden bg-slate-50 border-t border-gray-200 shadow-md">
    <ul class="flex flex-col p-4 font-medium">
      <li>
        <a routerLink="home" routerLinkActive="active"
           class="block py-2 px-3 text-black hover:bg-gray-100"
           aria-current="page">
          Home
        </a>
      </li>
      <li>
        <a routerLink="All-prodect" routerLinkActive="active"
           class="block py-2 px-3 text-black hover:bg-gray-100">
          All product
        </a>
      </li>
      <li>
        <a routerLink="categories" routerLinkActive="active"
           class="block py-2 px-3 text-black hover:bg-gray-100">
          Categories
        </a>
      </li>
      <li>
        <a routerLink="about" routerLinkActive="active"
           class="block py-2 px-3 text-black hover:bg-gray-100">
          About
        </a>
      </li>
    </ul>
  </div>
</nav>
