<div class="flex min-h-screen dark:bg-[#252525] flex-col lg:flex-row w-full relative text-center">
  <!-- Logo -->
  <img  class="absolute top-0 right-0 w-32 sm:w-48 rtl:left-0 rtl:right-auto "
  routerLink="/home" 
       src="images/logo 2 trams.png" 
       [alt]="'SIGNUP.LOGO_ALT' | translate">

  <!-- Background Image (Desktop) -->
  <app-background role="signup" class="hidden lg:block lg:w-2/5" />

  <!-- Signup Form -->
  <div class="flex flex-col justify-center items-center w-full px-4 sm:px-8 lg:px-16 lg:w-1/2">
    <h3 class="text-2xl sm:text-3xl font-semibold text-[#00366A] mt-16 sm:mt-0 dark:text-white">
      {{ 'SIGNUP.TITLE' | translate }}
    </h3>
    <p class="mt-4 dark:text-white text-[#757F95]">
      {{ 'SIGNUP.SUBTITLE' | translate }}
    </p>

    <form [formGroup]="register" (ngSubmit)="signup()" class="w-full max-w-xs sm:max-w-sm">
      <!-- Username Field -->
      <div class="relative w-full mt-4">
        <i class="fa-solid fa-user text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input 
          formControlName="username" 
          type="text" 
          [placeholder]="'SIGNUP.FORM.USERNAME.PLACEHOLDER' | translate"
          [attr.aria-label]="'SIGNUP.FORM.USERNAME.LABEL' | translate"
          class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 text-blue-700 dark:bg-gray-300">
      </div>
      <app-alerts [formName]="register" controlName="username"/>

      <!-- First Name Field -->
      <div class="relative w-full mt-4">
        <i class="fa-solid fa-user text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input 
          formControlName="firstName" 
          type="text" 
          [placeholder]="'SIGNUP.FORM.FIRST_NAME.PLACEHOLDER' | translate"
          [attr.aria-label]="'SIGNUP.FORM.FIRST_NAME.LABEL' | translate"
          class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 text-blue-700 dark:bg-gray-200">
      </div>
      <app-alerts [formName]="register" controlName="firstName"/>

      <!-- Last Name Field -->
      <div class="relative w-full mt-4">
        <i class="fa-solid fa-user text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input 
          formControlName="lastName" 
          type="text" 
          [placeholder]="'SIGNUP.FORM.LAST_NAME.PLACEHOLDER' | translate"
          [attr.aria-label]="'SIGNUP.FORM.LAST_NAME.LABEL' | translate"
          class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 text-blue-700 dark:bg-gray-200">
      </div>
      <app-alerts [formName]="register" controlName="lastName"/>

      <!-- Phone Field -->
      <div class="relative w-full mt-4">
        <i class="fa-solid fa-phone text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input 
          formControlName="phone" 
          type="tel" 
          [placeholder]="'SIGNUP.FORM.PHONE.PLACEHOLDER' | translate"
          [attr.aria-label]="'SIGNUP.FORM.PHONE.LABEL' | translate"
          class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 rtl:text-right text-blue-700 dark:bg-gray-200">
      </div>
      <app-alerts [formName]="register" controlName="phone"/>

      <!-- Email Field -->
      <div class="relative w-full mt-4">
        <i class="fas fa-envelope text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input 
          formControlName="email" 
          type="email" 
          [placeholder]="'SIGNUP.FORM.EMAIL.PLACEHOLDER' | translate"
          [attr.aria-label]="'SIGNUP.FORM.EMAIL.LABEL' | translate"
          class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 text-blue-700 dark:bg-gray-200">
      </div>
      <app-alerts [formName]="register" controlName="email"/>

      <!-- Password Field -->
      <div class="relative w-full mt-4">
        <i class="fas fa-lock text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input 
          formControlName="password" 
          type="password" 
          [placeholder]="'SIGNUP.FORM.PASSWORD.PLACEHOLDER' | translate"
          [attr.aria-label]="'SIGNUP.FORM.PASSWORD.LABEL' | translate"
          class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 text-blue-700 dark:bg-gray-200">
      </div>
      <app-alerts [formName]="register" controlName="password"/>

      <!-- Confirm Password Field -->
      <div class="relative w-full mt-4">
        <i class="fas fa-lock text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input 
          formControlName="rePassword" 
          type="password" 
          [placeholder]="'SIGNUP.FORM.CONFIRM_PASSWORD.PLACEHOLDER' | translate"
          [attr.aria-label]="'SIGNUP.FORM.CONFIRM_PASSWORD.LABEL' | translate"
          class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 text-blue-700 dark:bg-gray-200">
      </div>
      <app-alerts [formName]="register" controlName="rePassword"/>

      <!-- Error Message -->
      <p class="mt-2 text-red-600">{{errormessage}}</p>

      <!-- Submit Button -->
      <div class="text-center mt-6">
        <app-reg-button>
          {{ 'SIGNUP.FORM.REGISTER_BUTTON' | translate }}
        </app-reg-button>
      </div>

      <!-- Login Link (Mobile) -->
      <h2 class="text-center mt-8 block lg:hidden">
        {{ 'SIGNUP.FORM.HAVE_ACCOUNT' | translate }}
        <a class="text-blue-800 hover:underline" href="/login">
          {{ 'SIGNUP.FORM.LOGIN_LINK' | translate }}
        </a>
      </h2>
    </form>
  </div>
</div>
