<div class="flex flex-col justify-center items-center min-h-screen w-full px-4 sm:px-8 lg:px-16">
  <!-- Logo -->
  <img class="w-44 sm:w-52" 
       src="images/logo 2 trams.png" 
       [alt]="'VERIFICATION.LOGO_ALT' | translate">
  
  <!-- Title and Instructions -->
  <div class="text-center mt-5">
    <h1 class="text-xl font-semibold text-[#00366A]">
      {{ 'VERIFICATION.TITLE' | translate }}
    </h1>
    <p class="text-lg mt-4 text-[#757F95]">
      {{ 'VERIFICATION.INSTRUCTIONS' | translate }}
    </p>
    <p class="text-lg mt-2 text-gray-600">
      {{ 'VERIFICATION.EMAIL_EXAMPLE' | translate }}
    </p>
  </div>

  <!-- Verification Form -->
  <form [formGroup]="verifycode" (ngSubmit)="submit2()" class="w-full max-w-xs sm:max-w-sm mt-6">
    <!-- Code Input Fields -->
    <div class="flex justify-center space-x-2">
      <input 
        formControlName="digit1" 
        id="digit1" 
        type="text" 
        maxlength="1" 
        (input)="onInput($event, 'digit2')" 
        (paste)="onPaste($event)"
        [attr.aria-label]="('VERIFICATION.DIGIT_LABEL' | translate) + ' 1'"
        class="w-11 h-11 text-lg font-bold text-center border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-300 dark:border-gray-600 text-blue-700">

      <input 
        formControlName="digit2" 
        id="digit2" 
        type="text" 
        maxlength="1" 
        (input)="onInput($event, 'digit3', 'digit1')" 
        (paste)="onPaste($event)"
        [attr.aria-label]="('VERIFICATION.DIGIT_LABEL' | translate) + ' 2'"
        class="w-11 h-11 text-lg font-bold text-center border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-300 dark:border-gray-600 text-blue-700">

      <input 
        formControlName="digit3" 
        id="digit3" 
        type="text" 
        maxlength="1" 
        (input)="onInput($event, 'digit4', 'digit2')" 
        (paste)="onPaste($event)"
        [attr.aria-label]="('VERIFICATION.DIGIT_LABEL' | translate) + ' 3'"
        class="w-11 h-11 text-lg font-bold text-center border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-300 dark:border-gray-600 text-blue-700">

      <input 
        formControlName="digit4" 
        id="digit4" 
        type="text" 
        maxlength="1" 
        (input)="onInput($event, 'digit5', 'digit3')" 
        (paste)="onPaste($event)"
        [attr.aria-label]="('VERIFICATION.DIGIT_LABEL' | translate) + ' 4'"
        class="w-11 h-11 text-lg font-bold text-center border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-300 dark:border-gray-600 text-blue-700">

      <input 
        formControlName="digit5" 
        id="digit5" 
        type="text" 
        maxlength="1" 
        (input)="onInput($event, 'digit6', 'digit4')" 
        (paste)="onPaste($event)"
        [attr.aria-label]="('VERIFICATION.DIGIT_LABEL' | translate) + ' 5'"
        class="w-11 h-11 text-lg font-bold text-center border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-300 dark:border-gray-600 text-blue-700">

      <input 
        formControlName="digit6" 
        id="digit6" 
        type="text" 
        maxlength="1" 
        (input)="onInput($event, undefined, 'digit5')" 
        (paste)="onPaste($event)"
        [attr.aria-label]="('VERIFICATION.DIGIT_LABEL' | translate) + ' 6'"
        class="w-11 h-11 text-lg font-bold text-center border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-300 dark:border-gray-600 text-blue-700">
    </div>

    <!-- Verify Button -->
    <div class="text-center mt-6">
      <app-reg-button>
        {{ 'VERIFICATION.VERIFY_BUTTON' | translate }}
      </app-reg-button>
    </div>

    <!-- Resend Code Option -->
    <!-- <div class="text-center mt-4">
      <button type="button" 
              (click)="resendCode()"
              class="text-blue-600 hover:text-blue-800 hover:underline"
              [disabled]="resendDisabled">
        {{ 'VERIFICATION.RESEND_CODE' | translate }}
      </button>
    </div> -->
  </form>
</div>
