<div class="flex flex-col justify-center items-center min-h-screen w-full px-4 sm:px-8 lg:px-16">
  <!-- Logo -->
  <img class="w-32 sm:w-48" 
       src="images/logo 2 trams.png" 
       [alt]="'FORGOT_PASSWORD.LOGO_ALT' | translate">
  
  <!-- Title -->
  <h1 class="text-2xl font-semibold mt-10 text-center text-[#00366A]">
    {{ 'FORGOT_PASSWORD.TITLE' | translate }}
  </h1>
  
  <!-- Instructions -->
  <p class="text-lg mt-4 text-center text-[#757F95]">
    {{ 'FORGOT_PASSWORD.INSTRUCTIONS' | translate }}
  </p>
    
  <!-- Form -->
  <form [formGroup]="forgetpass" (ngSubmit)="submit()" class="w-full max-w-xs sm:max-w-sm mt-6">
    <!-- Email Field -->
    <div class="relative w-full">
      <i class="fas fa-envelope text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
      <input 
        formControlName="email" 
        type="email" 
        [placeholder]="'FORGOT_PASSWORD.EMAIL_PLACEHOLDER' | translate"
        [attr.aria-label]="'FORGOT_PASSWORD.EMAIL_LABEL' | translate"
        class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 text-blue-700 dark:bg-gray-300">
    </div>
    
    <!-- Validation Alerts -->
    <app-alerts [formName]="forgetpass" controlName="email"/>
    
    <!-- Submit Button -->
    <div class="text-center mt-6">
      <app-reg-button>
        {{ 'FORGOT_PASSWORD.BUTTON_TEXT' | translate }}
      </app-reg-button>
    </div>
  </form>
  
  <!-- Back to Login Link -->
  <div class="mt-6 text-center">
    <a routerLink="/login" class="text-blue-600 hover:underline">
      ← {{ 'FORGOT_PASSWORD.BACK_TO_LOGIN' | translate }}
    </a>
  </div>
</div>
