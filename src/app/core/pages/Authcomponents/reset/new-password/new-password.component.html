<div class="flex flex-col justify-center items-center min-h-screen w-full px-4 sm:px-8 lg:px-16">
<img class="w-48 sm:w-60" src="images/logo 2 trams.png" alt="Prime Care Logo">   
<div class="text-center mt-10">
<p class="text-xl">ENTER YOUR NEW PASSWORD</p>
</div>
<form [formGroup]="resetpass" (ngSubmit)="submit3()" class="w-full max-w-xs sm:max-w-sm mt-6">
<app-email-input>
<i class="fas fa-envelope text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
<input formControlName="email" type="email" placeholder="Email" class="dark:bg-gray-300 border border-blue-300 text-sm rounded-lg focus:ring-blue-500 text-blue-800 placeholder-blue-900 focus:border-blue-500 block w-full pl-10 p-2.5">
</app-email-input>
<app-alerts [formName]="resetpass" controlName="email"/>
<app-email-input>
<i class="fas fa-envelope text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
<input formControlName="newPassword" type="password" placeholder="Confirm Password" class="dark:bg-gray-300 border border-blue-300 text-sm rounded-lg focus:ring-blue-500 text-blue-800 placeholder-blue-900 focus:border-blue-500 block w-full pl-10 p-2.5">
</app-email-input>
<app-alerts [formName]="resetpass" controlName="newPassword"/>      
<div class="text-center mt-6">
<app-reg-button>Confirm</app-reg-button>
</div>
</form>
</div>
