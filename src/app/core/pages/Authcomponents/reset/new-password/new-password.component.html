<div class="flex flex-col justify-center items-center min-h-screen w-full px-4 sm:px-8 lg:px-16">
  <!-- Logo -->
  <img class="w-48 sm:w-60" 
       src="images/logo 2 trams.png" 
       [alt]="'PASSWORD_RESET.LOGO_ALT' | translate">
  
  <!-- Title -->
  <div class="text-center mt-10">
    <h1 class="text-xl font-semibold text-[#00366A]">
      {{ 'PASSWORD_RESET.TITLE' | translate }}
    </h1>
  </div>

  <!-- Password Reset Form -->
  <form [formGroup]="resetpass" (ngSubmit)="submit3()" class="w-full max-w-xs sm:max-w-sm mt-6">
    <!-- Email Field -->
    <app-email-input>
      <i class="fas fa-envelope text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
      <input 
        formControlName="email" 
        type="email" 
        [placeholder]="'PASSWORD_RESET.FORM.EMAIL.PLACEHOLDER' | translate"
        [attr.aria-label]="'PASSWORD_RESET.FORM.EMAIL.LABEL' | translate"
        class="dark:bg-gray-300 border border-blue-300 text-sm rounded-lg focus:ring-blue-500 text-blue-800 placeholder-blue-900 focus:border-blue-500 block w-full pl-10 p-2.5">
    </app-email-input>
    <app-alerts [formName]="resetpass" controlName="email"/>

    <!-- New Password Field -->
    <app-email-input class="mt-4">
      <i class="fas fa-lock text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
      <input 
        formControlName="newPassword" 
        type="password" 
        [placeholder]="'PASSWORD_RESET.FORM.NEW_PASSWORD.PLACEHOLDER' | translate"
        [attr.aria-label]="'PASSWORD_RESET.FORM.NEW_PASSWORD.LABEL' | translate"
        class="dark:bg-gray-300 border border-blue-300 text-sm rounded-lg focus:ring-blue-500 text-blue-800 placeholder-blue-900 focus:border-blue-500 block w-full pl-10 p-2.5">
    </app-email-input>
    <app-alerts [formName]="resetpass" controlName="newPassword"/>

    <!-- Confirm Password Field -->
    <app-email-input class="mt-4">
      <i class="fas fa-lock text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
      <input 
        formControlName="confirmPassword" 
        type="password" 
        [placeholder]="'PASSWORD_RESET.FORM.CONFIRM_PASSWORD.PLACEHOLDER' | translate"
        [attr.aria-label]="'PASSWORD_RESET.FORM.CONFIRM_PASSWORD.LABEL' | translate"
        class="dark:bg-gray-300 border border-blue-300 text-sm rounded-lg focus:ring-blue-500 text-blue-800 placeholder-blue-900 focus:border-blue-500 block w-full pl-10 p-2.5">
    </app-email-input>
    <app-alerts [formName]="resetpass" controlName="confirmPassword"/>

    <!-- Submit Button -->
    <div class="text-center mt-6">
      <app-reg-button>
        {{ 'PASSWORD_RESET.FORM.SUBMIT_BUTTON' | translate }}
      </app-reg-button>
    </div>
  </form>

  <!-- Back to Login Link -->
  <div class="mt-6 text-center">
    <a routerLink="/login" class="text-blue-600 hover:underline">
      ← Back to Login
    </a>
  </div>
</div>
