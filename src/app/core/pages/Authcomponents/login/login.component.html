<div class="flex min-h-screen dark:bg-[#252525]  flex-col lg:flex-row w-full">
  <!-- Login Form Section -->
  <div class="flex flex-col justify-center items-center w-full lg:w-2/3 px-4 sm:px-8 lg:px-16 relative mr-20 sm:mr-20">
    <!-- Logo -->
    <img class="absolute top-0 left-0 mb-4 w-32 sm:w-48" 
         src="images/logo 2 trams.png" 
         [alt]="'PRIME_CARE.LOGO_ALT' | translate">
    
    <!-- Title -->
    <h3 class="font-semibold text-center text-[#00366A] dark:text-white text-xl sm:text-2xl lg:text-3xl mt-16">
      {{ 'LOGIN.TITLE' | translate }} <span class="text-2xl sm:text-4xl">{{ 'LOGIN.BRAND' | translate }}</span>
    </h3>
    
    <!-- Subtitle -->
    <p class="text-black mt-4 text-center dark:text-white transition-colors duration-300">{{ 'LOGIN.SUBTITLE' | translate }}</p>
    
    <!-- Login Form -->
    <form [formGroup]="login" (ngSubmit)="Login()" class="w-full mt-5 max-w-xs sm:max-w-sm">
      <!-- Email Field -->
      <div class="relative w-full">
        <i class="fas fa-envelope text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input formControlName="email" 
               type="email" 
               [placeholder]="'LOGIN.FORM.EMAIL.PLACEHOLDER' | translate"
               class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 text-blue-700 dark:bg-gray-300"
               [attr.aria-label]="'LOGIN.FORM.EMAIL.LABEL' | translate">
      </div>
      <app-alerts [formName]="login" controlName="email"/>
      
      <!-- Password Field -->
      <div class="relative w-full mt-4">
        <i class="fas fa-lock text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2"></i>
        <input formControlName="password" 
               type="password" 
               [placeholder]="'LOGIN.FORM.PASSWORD.PLACEHOLDER' | translate"
               class="w-full border border-blue-300 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 pl-10 p-2.5 placeholder-blue-900 text-blue-700 dark:bg-gray-300"
               [attr.aria-label]="'LOGIN.FORM.PASSWORD.LABEL' | translate">
      </div>
      <app-alerts [formName]="login" controlName="password"/>
      
      <!-- Error Message -->
      <p class="mt-2 text-center text-red-600">{{errormessage}}</p>
      
      <!-- Forgot Password -->
      <div class="w-full mt-5 text-center">
        <a routerLink="/resetPassword" class="text-blue-900 hover:underline dark:text-white">
          {{ 'LOGIN.FORM.FORGOT_PASSWORD' | translate }}
        </a>
      </div>
      
      <!-- Submit Button -->
      <div class="text-center mt-6">
        <app-reg-button>{{ 'LOGIN.FORM.SUBMIT' | translate }}</app-reg-button>
      </div>
      
      <!-- Create Account (Mobile) -->
      <h2 class="text-center mt-10 block lg:hidden dark:text-white">
        {{ 'LOGIN.FORM.NO_ACCOUNT' | translate }} 
        <span>
          <a class="text-blue-800 hover:underline dark:text-blue-600" href="/register">
            {{ 'LOGIN.FORM.CREATE_ACCOUNT' | translate }}
          </a>
        </span>
      </h2>
    </form>
  </div>
    
  <!-- Background Image (Desktop) -->
  <app-background class="hidden lg:block" role="login" />
</div>
