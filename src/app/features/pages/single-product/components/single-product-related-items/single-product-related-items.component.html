<div class="relative text-2xl w-48 font-semibold text-black max-lg:mx-6 mx-16 mt-10 dark:text-white transition-colors duration-300">
  {{ 'RELATED_PRODUCTS.TITLE' | translate }}
  <span
  class="absolute  dark:bg-white/50 transition-colors duration-300 bottom-0 start-0 h-2 w-3/4 bg-blue-600/20 rounded-e-full end-0 rounded-s-full"
></span>

<!-- الخط الرفيع الأمامي -->
<span
  class="absolute  dark:bg-white transition-colors duration-300 bottom-0 start-0 h-[2px] w-1/2 bg-blue-600 end-0 rounded-s-full"
></span></div>

<div class="grid grid-cols-1 mx-14 max-sm:grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-8">
  <app-cart
    *ngFor="let product of relatedProducts"
    [product]="product"
    class="w-full"
  ></app-cart>
</div>

<div class="text-center mt-8 pb-10">
  <a 
  [routerLink]="['/details-category', categoryId]"
  class="text-blue-600 hover:text-blue-800 hover:underline cursor-pointer text-center mt-8 mb-10"
  [attr.aria-label]="'RELATED_PRODUCTS.VIEW_ALL' | translate"
>
  {{ 'RELATED_PRODUCTS.VIEW_ALL' | translate }}
</a>
</div>
