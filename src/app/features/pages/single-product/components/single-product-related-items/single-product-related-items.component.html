<div
  class="relative text-2xl w-48 font-semibold text-black max-lg:ml-6 ml-24 mt-10 dark:text-white transition-colors duration-300"
>
  Related Items
  <span
    class="absolute left-0 bottom-0 w-3/4 h-2 bg-blue-600/20 rounded-r-full dark:bg-white/50 duration-300 transition-colors"
  ></span>
  <span
    class="absolute left-0 bottom-0 w-1/2 h-[2px] bg-blue-600 rounded-r-full dark:bg-white duration-300 transition-colors"
  ></span>
</div>
<div
  class="grid grid-cols-1 mx-14 max-sm:grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-8"
>
  <app-cart
    *ngFor="let product of relatedProducts"
    [product]="product"
    class="w-full"
  >
  </app-cart>
</div>
