<div class="relative text-2xl w-60 font-semibold text-black mb-8 max-lg:ml-6 ml-24 dark:text-white transition-colors duration-300"></div>">
  {{ 'PRODUCT_INFO.TITLE' | translate }}
  <span class="absolute left-0 bottom-0 w-3/4 h-2 bg-blue-600/20 rounded-r-full dark:bg-white/50 duration-300 transition-colors"></span>
  <span class="absolute left-0 bottom-0 w-1/2 h-[2px] bg-blue-600 rounded-r-full dark:bg-white duration-300 transition-colors"></span>


<div class="md:flex max-md:mx-5 mx-12 mt-4 mb-14">
<!-- Product Image -->
<div class="ml-10 max-md:mb-6 max-md:ml-0 rounded-20 border w-72 h-80">
  <img class="rounded-20 images w-96 h-full" 
       [src]="product.imgCover" 
       [alt]="product.title"
       *ngIf="product.imgCover; else placeholderImage"/>
  <ng-template #placeholderImage>
    <div class="w-96 h-full flex items-center justify-center bg-gray-200 rounded-20">
      <span class="text-gray-500">{{ 'PRODUCT_INFO.PLACEHOLDER' | translate }}</span>
    </div>
  </ng-template>
</div>

<!-- Product Details -->
<div class="md:ml-14  dark:text-white transition-colors duration-300">
  <h2>{{product.description}}</h2>
  <ul class="list-disc ml-8  dark:text-white transition-colors duration-300">
    <li *ngFor="let point of 'PRODUCT_INFO.BULLET_POINTS' | translate">
      {{ point }}
    </li>
  </ul>
</div>
</div>
