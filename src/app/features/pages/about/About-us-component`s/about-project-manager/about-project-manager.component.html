<h2 class="text-center text-3xl font-bold mt-14 text-[#160E4B]">{{ 'OUR_TEAM.TITLE' | translate }}</h2>
<div class="relative bg-white max-w-6xl border border-[#57CFFB] mx-auto pt-8 p-6 mt-8 rounded-lg shadow-md">
  <!-- Decorative elements (no translation needed) -->
  <div class="absolute top-0 left-0 w-24 h-24 bg-[#57CFFB]" style="clip-path: polygon(0 0, 100% 0, 0 100%);"></div>
  <div class="absolute bottom-0 right-0 w-24 h-24 bg-[#57CFFB]" style="clip-path: polygon(100% 100%, 100% 0, 0 100%);"></div>

  <div class="grid grid-cols-1 w-[80%] max-md:w-full m-auto md:grid-cols-2 gap-8">
    <!-- Team Member Profile -->
    <div class="flex flex-col items-center m-auto">
      <img src="/images/Our Team/Seif Emam.png" [alt]="'OUR_TEAM.PROJECT_MANAGER.IMAGE_ALT' | translate" class="object-cover rounded-md mb-4 w-[80%] shadow"/>
      <h2 class="text-xl font-semibold text-[#160E4B] mb-1">
        {{ 'OUR_TEAM.PROJECT_MANAGER.NAME' | translate }}
      </h2>
      <p class="text-[#160E4B]">{{ 'OUR_TEAM.PROJECT_MANAGER.POSITION' | translate }}</p>
    </div>
    
    <!-- Project Manager Description -->
    <div class="pt-4">
      <h2 class="text-center text-3xl font-semibold mt-15 text-[#160E4B]">{{ 'OUR_TEAM.PROJECT_MANAGER.TITLE' | translate }}</h2>
      <h2 class="text-center text-2xl max-lg:text-2xl text-[#160E4B] text-black mt-10 leading-relaxed pt-4">
        {{ 'OUR_TEAM.PROJECT_MANAGER.DESCRIPTION' | translate }}
      </h2>
    </div>
  </div>
</div>
