<div class="mt-20 text-center">
<h2 class="text-2xl font-semibold text-[#5BB8FF]">Testemonial</h2>
<h2 class="mt-5 text-[#555555] dark:text-white transition-colors duration-300 leading-relaxed"> Lorem ipsum dolor sit amet consectetur adipiscing elit volutpat gravida <br class="max-sm:hidden">

  <div class="max-w-6xl mx-auto px-4 mt-6">
    <div class="grid gap-8 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
      @for (test of testimonials; track $index) {
    <div class="rounded-xl shadow-md p-11 dark:bg-[#282828] transition-colors duration-300 ">
        <img class="w-16 h-16 rounded-full mb-4 object-cover" [src]="test.image" alt="Team Member">
        <h3 class="text-xl font-semibold dark:text-white duration-300 transition-colors">“{{test.title}}”</h3>
        <p class="text-gray-500 dark:text-gray-300 duration-300 transition-colors text-sm mb-4 leading-relaxed pt-2.5">{{test.description}}</p>
      <h2 class="text-[#5BB8FF] mt-2">{{test.name}}</h2>
<h3 class="text-[#555555] pt-1">{{test.position}}</h3>
 </div>
      }
  
  </div>
