<div class="mt-20 text-center">
<h2 class="text-2xl font-semibold text-[#5BB8FF]">Meet our team members</h2>
<h2 class="mt-5 text-[#555555] dark:text-white transition-colors duration-300 leading-relaxed"> Lorem ipsum dolor sit amet consectetur adipiscing elit volutpat gravida <br class="max-sm:hidden">
   malesuada quam commodo id integer nam.</h2>
    
</div>

  <div class="max-w-5xl mx-auto px-4 mt-10">
    <div class="grid gap-20 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
  @for (team of team; track $index) {
     <div class=" rounded-2xl shadow-md p-6 dark:bg-[#282828] transition-colors duration-300  text-center">
        <img class="w-24 h-24 mx-auto rounded-full mb-4 object-cover" [src]="team.image" alt="Team Member">
        <h3 class="text-xl font-semibold text-[#5BB8FF]">{{team.name}}</h3>
        <p class="font-medium  mb-2 dark:text-white duration-300 transition-colors">{{team.role}}</p>
        <p class="text-gray-500 text-sm mb-4 dark:text-white duration-300 transition-colors leading-relaxed">{{team.description}}</p>
        <div class="flex justify-center space-x-4 text-blue-500 text-xl">
          <a ><i class="fab fa-facebook-f cursor-pointer"></i></a>
          <a ><i class="fab fa-twitter cursor-pointer"></i></a>
          <a ><i class="fab fa-instagram text-yellow-500 cursor-pointer"></i></a>
          <a ><i class="fab fa-linkedin-in cursor-pointer"></i></a>
        </div>
      </div>
  }
       
       
      


    </div>
  </div>
