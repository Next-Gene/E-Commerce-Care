<div
  class="bg-slate-50 min-h-screen py-8 dark:bg-[#252525] duration-300 transition-colors"
>
  <div class="max-w-7xl mx-auto px-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:items-start">
      <!-- Payment Methods Section -->
      <div class="md:col-span-2 p-6">
        <h2
          class="text-xl text-[#160E4B] font-light mb-4 dark:text-white duration-300 transition-colors text-right flex items-center justify-between"
        >
          {{ "PAYMENT.TITLE" | translate }}
        </h2>

        <!-- Payment Options -->
        <div class="flex gap-4 mb-6">
          @for (option of paymentOptions; track option.type) {
          <div
            class="payment-option border border-gray-300 rounded-3xl p-3 text-center cursor-pointer shadow-2xl hover:shadow-2xl hover:text-blue-500 hover:border-blue-600 transition-all dark:shadow-blue-500/20"
            [ngClass]="{
              'border-blue-700 text-blue-500 shadow-2xl dark:shadow-blue-500/50':
                paymentMethod === option.type
            }"
            (click)="selectPaymentMethod(option.type)"
            [attr.aria-label]="option.label"
          >
            <img
              [src]="option.img"
              [alt]="option.label"
              class="w-12 mx-auto mb-2"
            />
            <p class="text-gray-500 font-extralight">
              {{ option.label }}
            </p>
          </div>
          }
        </div>

        <!-- Cash on Delivery Message -->
        @if (paymentMethod === 'cash') {
        <div
          class="text-base font-light text-gray-600 bg-gray-50 p-3 mb-4 rounded-md"
        >
          <p>
            {{ "PAYMENT.METHODS.CASH.MESSAGE" | translate }}
          </p>
        </div>
        }

        <!-- Credit Card Form -->
        @if (paymentMethod === 'card') {
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
        }

        <!-- Navigation Buttons -->
        <div class="flex justify-between mt-6">
          <button
            routerLink="/cart"
            class="px-1 py-3 bg-blue-600 text-white rounded-md shadow-md hover:bg-blue-700 transition-colors duration-200"
          >
            &larr; {{ "PAYMENT.BUTTONS.PREVIOUS" | translate }}
          </button>
          <button
            (click)="processPayment()"
            class="max-sm:px-1 xl:px-2 py-3 bg-blue-600 text-white rounded-md shadow-md hover:bg-blue-700 transition-colors duration-200"
          >
            {{ "PAYMENT.BUTTONS.PAY_NOW" | translate }} &rarr;
          </button>
        </div>
      </div>

      <!-- Cart Summary -->
      <div class="md:col-span-1">
        <app-cart-sammary></app-cart-sammary>
      </div>
    </div>
  </div>
</div>
