<div class="flex  justify-between items-center pt-24 max-sm:pt-20 max-sm:ml-2 max-sm:mb-1 max-sm:mr-3 ml-10 mr-10">
  <div class="relative text-l transition-colors duration-300 dark:text-white font-bold text-black pb-1/2">
      Shop By Category
      <span class="absolute dark:bg-white/50 transition-colors duration-300 left-0 bottom-0 w-3/4 h-2 bg-blue-600/20 rounded-r-full"></span>
      <span class="absolute transition-colors duration-300 dark:bg-white left-0 bottom-0 w-1/2 h-[2px] bg-blue-600 rounded-r-full"></span>
  </div>
  <a  routerLink="/categories" class="text-gray-500 text-sm font-medium hover:text-gray-600 li">see all</a>
</div>

<owl-carousel-o [options]="customOptions">
  @for (category of Categories; track category._id) {
    <ng-template carouselSlide>
      <div class="flex justify-center p-4">
        <div class="bg-white dark:bg-[#313131] transition-all duration-300 shadow-md shadow-gray-400 dark:shadow-none rounded-lg w-70 h-28 flex items-center overflow-hidden">
          <img [src]="category.image" [alt]="category.name" class="w-1/2 h-full object-cover">
          <div class="w-2/3 p-2 flex flex-col justify-center">
            <h3 class="text-[11px] md:text-xs font-bold text-[#0070CD] dark:text-white duration-300 transition-colors text-center">
              {{ category.name }}
            </h3>
           
          </div>
        </div>
      </div>
    </ng-template>
  }
</owl-carousel-o>
