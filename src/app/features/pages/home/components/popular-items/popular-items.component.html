<div class="container mx-auto mb-10 px-4">
  <!-- Title and Category List -->
  <div class="flex flex-col sm:flex-row justify-between items-center w-full gap-4">
    <div class="relative text-2xl font-semibold text-black">
      {{ 'POPULAR_ITEMS.TITLE' | translate }}
      <span class="absolute left-0 bottom-0 w-3/4 h-2 bg-blue-600/20 rounded-r-full"></span>
      <span class="absolute left-0 bottom-0 w-1/2 h-[2px] bg-blue-600 rounded-r-full"></span>
    </div>
    
    <div class="w-full sm:w-auto overflow-x-auto">
      <ul class="flex gap-2 whitespace-nowrap max-sm:flex-wrap max-sm:justify-center">
        <li
          *ngFor="let category of categories; let i = index"
          class="cursor-pointer text-gray-600 hover:text-pink-500 transition-colors duration-300 px-2"
          [ngClass]="{
            'text-pink-500 border-b-2 border-pink-500': selectedCategoryIndex === i
          }"
          (click)="onCategoryClick(category, i)"
        >
          {{ 'POPULAR_ITEMS.CATEGORIES.' + category.name | uppercase | translate }}
        </li>
      </ul>
    </div>
  </div>

  <!-- Product Grid -->
  <div class="grid grid-cols-1 max-sm:grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mt-8">
    <app-cart
      *ngFor="let product of products"
      [product]="product"
      class="w-full"
    ></app-cart>
  </div>
</div>
