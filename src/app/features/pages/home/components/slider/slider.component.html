<div class="max-sm:mt-4 mt-8 flex flex-col lg:flex-row w-full">
  <div class="w-full max-sm:w-[100%] overflow-hidden max-sm:pl-0 max-sm:pr-0 pl-4 pr-4">
    <owl-carousel-o [options]="carouselOptions">
      <ng-container *ngFor="let image of images;">
        <ng-template carouselSlide>
          <img [src]="image.path" alt="Product Image" class="w-full h-full">

        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </div>

  <div class="bc w-full sm:w-1/2 xl:w-1/5 text-right rounded-lg  mx-auto mt-8 xl:m-0">
    <h3 class="text-[#00366A] mr-3 mt-8">Prime Care</h3>
    <app-texts>All Your Baby Care</app-texts>
    <app-texts>With Us</app-texts>
    <app-disc-btn></app-disc-btn>
  </div>
</div>
