<div class="dark:bg-[#242424] mx-auto max-sm:p-1 px-4 md:px-8 transition-colors duration-300  xl:px-20 max-sm:mx-3 max-sm:py-16 py-24 xl:pb-20">
  <!-- Title Section -->
  <div class="relative text-2xl font-semibold text-black inline-block mb-5 dark:text-white transition-colors duration-300">
    {{ "PRODUCTS_SECTION.TITLE" | translate }}
    <span class="absolute bottom-0 start-0 h-2 w-3/4 bg-blue-600/20 rounded-r-full end-0 rounded-s-full dark:bg-white/50 duration-300 transition-colors"></span>
    <!-- الخط الرفيع الأمامي -->
    <span class="absolute bottom-0 start-0 h-[2px] w-1/2 bg-blue-600 end-0 rounded-s-full dark:bg-white duration-300 transition-colors"></span>
  </div>

  <!-- Mobile Filters Button -->
  <div class="sm:hidden mb-4">
    <button (click)="toggleFilters()" class="bg-[var(--button-bg-color)] rounded-40 text-white py-2 px-4 flex items-center">
      <i class="fa-solid fa-bars mr-2 text-xl"></i>
      <span>{{ "PRODUCTS_SECTION.FILTERS_BUTTON" | translate }}</span>
    </button>
  </div>

  <!-- Backdrop for small screens when filters are open -->
  <div *ngIf="isMobile() && showFilters" class="fixed inset-0 bg-black opacity-70 z-40" (click)="toggleFilters()"></div>

  <!-- Main Content Area -->
  <div class="flex flex-row xl:gap-6 relative">
    <!-- Filters Component -->
    <app-filters
      [products]="products"
      [categories]="categories"
      [showFilters]="showFilters"
      (filteredProductsChange)="handleFilteredProducts($event)"
      (toggleFiltersEvent)="toggleFilters()"
    ></app-filters>

    <!-- Products Grid -->
    <section  class="flex-1 max-sm:mb-3 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 auto-rows-fr gap-8 md:gap-x-4 lg:gap-6">
      <app-cart
        *ngFor="let product of showingProducts"
        [product]="product"
        class="product-card flex flex-col justify-between h-full min-h-[520px]"
      ></app-cart>
    </section>
  </div>

  <app-pagination
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (pageChange)="onPageChange($event)"
  ></app-pagination>
</div>
