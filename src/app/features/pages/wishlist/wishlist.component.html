<div class="min-h-screen bg-gradient-to-br from-gray-50 to-white dark:from-[#242424] dark:to-[#242424] p-4 transition-colors duration-300">
  <!-- Header -->
  <div class="container mx-auto px-4 pt-20 pb-8">
    <h1 class="text-4xl font-bold text-gray-800 dark:text-white text-center mb-2">My Wishlist</h1>
    <p class="text-gray-600 dark:text-gray-300 text-center">Keep track of all your favorite items</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="flex justify-center items-center min-h-[400px]">
    <div class="text-center">
      <div role="status">
        <svg aria-hidden="true" class="inline w-12 h-12 text-gray-200 animate-spin dark:text-gray-600 fill-[#3CC1FF]" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
          <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
        </svg>
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-4 text-gray-600 dark:text-gray-300">Loading your wishlist...</p>
    </div>
  </div>

  <ng-container *ngIf="wishlistItems$ | async as wishlistItems">
    <!-- Empty State -->
    <div *ngIf="!loading && wishlistItems.length === 0" class="container mx-auto px-4">
      <div class="flex flex-col items-center justify-center min-h-[400px] text-center">
        <img src="images/wishlistEmpty.png" alt="Empty Wishlist" class="w-64 h-64 mb-6 opacity-75">
        <h2 class="text-2xl font-semibold text-gray-800 dark:text-white mb-2">Your wishlist is empty</h2>
        <p class="text-gray-600 dark:text-gray-300 mb-6">Start adding items to your wishlist by browsing our products</p>
        <button (click)="navigateToHome()" class="bg-[#3CC1FF] hover:bg-[#2BB1EF] text-white font-medium rounded-lg text-sm px-8 py-3 transition duration-300 ease-in-out transform hover:scale-105">
          <i class="fas fa-shopping-bag mr-2"></i>
          Browse Products
        </button>
      </div>
    </div>

    <!-- Wishlist Items Grid -->
    <div *ngIf="!loading && wishlistItems.length > 0" class="container mx-auto px-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Wishlist Item Card -->
        <div *ngFor="let item of wishlistItems" class="product-card bg-white dark:bg-[#252525] rounded-xl shadow-lg hover:shadow-xl transition-all duration-300">
          <div class="product-card__inner p-4">
            <!-- Image Container -->
            <div class="product-card__image" (click)="navigateToProduct(item.id)">
              <img 
                class="w-full h-full object-cover rounded-lg" 
                [src]="item.pictureUrl" 
                [alt]="item.productName"
              />
              <div class="product-card__overlay w-full h-full absolute top-0 flex justify-center items-center">
                <div class="flex gap-6">
                  <!-- View Button -->
                  <div class="product-card__overlay__item flex justify-center items-center">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                    </svg>
                  </div>
                  <!-- Remove from Wishlist Button -->
                  <div 
                    class="product-card__overlay__item flex justify-center items-center"
                    (click)="removeFromWishlist(item.id); $event.stopPropagation()"
                  >
                    <svg class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                  </div>
                </div>
              </div>
            </div>

            <!-- Product Info -->
            <div class="product-card__content mt-4 space-y-3">
              <!-- Title -->
              <h3 
                class="font-semibold text-gray-800 dark:text-white transition-colors duration-300 hover:text-[#3CC1FF] cursor-pointer line-clamp-2" 
                [title]="item.productName"
                (click)="navigateToProduct(item.id)"
              >
                {{ item.productName }}
              </h3>

              <!-- Price and Add to Cart -->
              <div class="flex items-center justify-between">
                <div class="flex flex-col">
                  <span class="text-[#3CC1FF] font-bold text-lg">
                    {{ item.price | currency:'USD' }}
                  </span>
                  <span class="text-xs text-green-500">Free Shipping</span>
                </div>
                <!-- Add to Cart Button -->
                <div class="product-card__actions">
                  <div class="product-card__actions__item">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
